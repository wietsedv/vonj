# Builds the app and publishes it to GitHub Pages. There is no backend, so the
# whole site is the prerendered output of `npm run build`.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish, but only ever queue one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # WebKit runs on macOS rather than alongside the other two engines. Linux
  # WebKit plays media through GStreamer, which on a headless runner crashes
  # the page process at random once an <audio> starts playing - with or without
  # a sound device - and takes the rest of the suite down with it. Safari, what
  # the iPads in a classroom run, plays through Apple's own media stack, which
  # is also what WebKit uses on macOS, so this is the run that tests it.
  test-webkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install webkit
      - run: npx vitest run --project "client (webkit)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Chromium and Firefox here; WebKit has its own job above.
      - run: npx playwright install --with-deps chromium firefox

      - run: npm run check
      - run: npm run lint
      - run: npx vitest run --project server --project "client (chromium)" --project "client (firefox)"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # A project site is served from /<repo>, so the app has to be built with
      # that prefix baked in.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: [build, test-webkit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
