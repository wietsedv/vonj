# Builds the app and publishes it to GitHub Pages. There is no backend, so the
# whole site is the prerendered output of `npm run build`.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish, but only ever queue one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The browser test project runs the suite in all three engines.
      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run check
      - run: npm run lint
      - run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # A project site is served from /<repo>, so the app has to be built with
      # that prefix baked in.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
